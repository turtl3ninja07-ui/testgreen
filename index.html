<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Green Grid | Planet Earth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { gridTemplateColumns: { '50': 'repeat(50, minmax(0, 1fr))' } } }
        }
    </script>

    <style>
        body { 
            background-color: #000; 
            margin: 0; 
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* 3D THREE.JS EARTH CONTAINER */
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .grid-container {
            position: relative;
            z-index: 10;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, memo, useEffect, useRef } = React;

        const MOCK_SUPPORTERS = [
            { name: "Tesla", domain: "tesla.com" },
            { name: "Patagonia", domain: "patagonia.com" },
            { name: "Apple", domain: "apple.com" },
            { name: "Microsoft", domain: "microsoft.com" },
            { name: "SpaceX", domain: "spacex.com" }
        ];

        const GridCell = memo(({ supporter }) => {
            return (
                <div className={`aspect-square border border-white/5 transition-all duration-300 ${supporter ? 'bg-white/10 border-emerald-500/50' : 'hover:bg-emerald-500/20'}`}>
                    {supporter && (
                        <img 
                            src={`https://www.google.com/s2/favicons?sz=64&domain=${supporter.domain}`}
                            className="w-full h-full object-contain p-0.5"
                        />
                    )}
                </div>
            );
        });

        const App = () => {
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (!containerRef.current) return;

                const width = containerRef.current.offsetWidth;
                const height = containerRef.current.offsetHeight;

                // 1. Scene & Camera
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.z = 2.5;

                // 2. Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                containerRef.current.appendChild(renderer.domElement);

                // 3. Earth Sphere
                const textureLoader = new THREE.TextureLoader();
                const earthTexture = textureLoader.load('https://raw.githubusercontent.com/tuchkuch/nasa-earth-assets/master/earth_dark.jpg');
                
                const geometry = new THREE.SphereGeometry(1, 64, 64);
                const material = new THREE.MeshPhongMaterial({
                    map: earthTexture,
                    shininess: 5,
                });
                const earth = new THREE.Mesh(geometry, material);
                scene.add(earth);

                // 4. Atmosphere Glow (Slightly larger sphere)
                const atmosGeom = new THREE.SphereGeometry(1.02, 64, 64);
                const atmosMat = new THREE.MeshBasicMaterial({
                    color: 0x3b82f6,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide
                });
                const atmosphere = new THREE.Mesh(atmosGeom, atmosMat);
                scene.add(atmosphere);

                // 5. Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
                scene.add(ambientLight);

                const sunLight = new THREE.DirectionalLight(0xffffff, 2);
                sunLight.position.set(5, 3, 5);
                scene.add(sunLight);

                // 6. Animation
                const animate = () => {
                    requestAnimationFrame(animate);
                    earth.rotation.y += 0.0015;
                    renderer.render(scene, camera);
                };
                animate();

                // 7. Handle Resize
                const handleResize = () => {
                    if (!containerRef.current) return;
                    const newWidth = containerRef.current.offsetWidth;
                    const newHeight = containerRef.current.offsetHeight;
                    camera.aspect = newWidth / newHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(newWidth, newHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (containerRef.current) {
                        containerRef.current.removeChild(renderer.domElement);
                    }
                };
            }, []);

            const gridData = useMemo(() => {
                const data = new Array(2500).fill(null);
                for(let i=0; i<30; i++) {
                    const rand = Math.floor(Math.random() * 2500);
                    data[rand] = MOCK_SUPPORTERS[Math.floor(Math.random() * MOCK_SUPPORTERS.length)];
                }
                return data;
            }, []);

            return (
                <div className="grid-container min-h-screen">
                    <header className="py-20 text-center">
                        <h1 className="text-6xl font-black tracking-tighter text-white drop-shadow-2xl">THE GREEN GRID</h1>
                        <p className="text-emerald-400 tracking-widest uppercase text-sm mt-2">Ownership in Earth's Recovery</p>
                    </header>
                    
                    <div className="max-w-[1000px] mx-auto px-4 pb-40">
                        <div className="relative">
                            {/* 3D EARTH CANVAS */}
                            <div id="canvas-container" ref={containerRef}></div>
                            
                            <div className="grid grid-cols-50 gap-0 border border-white/10 backdrop-blur-[2px] relative z-10">
                                {gridData.map((s, i) => <GridCell key={i} supporter={s} />)}
                            </div>
                        </div>
                    </div>

                    <footer className="fixed bottom-0 w-full bg-black/60 backdrop-blur-xl border-t border-white/10 p-6">
                        <div className="max-w-4xl mx-auto flex items-center gap-6">
                            <span className="text-emerald-500 font-bold uppercase text-xs">Recovery Status</span>
                            <div className="flex-1 h-2 bg-white/10 rounded-full overflow-hidden">
                                <div className="h-full bg-emerald-500 shadow-[0_0_10px_#10b981]" style={{width: '34%'}}></div>
                            </div>
                            <span className="text-white font-bold">34%</span>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
