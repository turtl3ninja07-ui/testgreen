<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Green Grid | 3D Earth Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { gridTemplateColumns: { '50': 'repeat(50, minmax(0, 1fr))' } } }
        }
    </script>

    <style>
        body { 
            background-color: #000; 
            margin: 0; 
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        #three-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .grid-overlay {
            position: relative;
            z-index: 10;
            background: transparent;
        }
        /* Glassmorphism εφέ για το grid */
        .grid-mesh {
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(1px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, memo, useEffect, useRef } = React;

        // --- Three.js Component για τη NASA Earth ---
        const Earth3D = () => {
            const containerRef = useRef();

            useEffect(() => {
                const container = containerRef.current;
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                // Φόρτωση Texture (NASA Dark Earth)
                const loader = new THREE.TextureLoader();
                const earthTexture = loader.load('https://raw.githubusercontent.com/tuchkuch/nasa-earth-assets/master/earth_dark.jpg');
                const earthBumpTexture = loader.load('https://raw.githubusercontent.com/tuchkuch/nasa-earth-assets/master/earth_bump.jpg');
                const earthSpecularTexture = loader.load('https://raw.githubusercontent.com/tuchkuch/nasa-earth-assets/master/earth_specular.jpg');

                // Δημιουργία Σφαίρας
                const geometry = new THREE.SphereGeometry(2, 64, 64);
                const material = new THREE.MeshStandardMaterial({ 
                    map: earthTexture,
                    bumpMap: earthBumpTexture,
                    bumpScale: 0.05,
                    specularMap: earthSpecularTexture,
                    roughness: 0.7,
                    metalness: 0.1
                });
                const earth = new THREE.Mesh(geometry, material);
                scene.add(earth);

                // Ατμοσφαιρική Λάμψη (Glow)
                const glowGeo = new THREE.SphereGeometry(2.05, 64, 64);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x00aaff,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                scene.add(glow);

                // Φωτισμός (Cinematic Light)
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
                scene.add(ambientLight);

                const pointLight = new THREE.PointLight(0xffffff, 1.5);
                pointLight.position.set(5, 3, 5);
                scene.add(pointLight);

                camera.position.z = 4.2;

                const animate = () => {
                    requestAnimationFrame(animate);
                    earth.rotation.y += 0.001; // Αργή περιστροφή
                    renderer.render(scene, camera);
                };

                animate();

                // Handle Resize
                const handleResize = () => {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    container.removeChild(renderer.domElement);
                };
            }, []);

            return <div id="three-canvas-container" ref={containerRef} />;
        };

        const MOCK_SUPPORTERS = [
            { name: "Tesla", domain: "tesla.com" },
            { name: "Apple", domain: "apple.com" },
            { name: "Microsoft", domain: "microsoft.com" },
            { name: "Netflix", domain: "netflix.com" }
        ];

        const GridCell = memo(({ supporter }) => (
            <div className={`aspect-square border border-white/5 transition-all duration-300 ${supporter ? 'bg-white/10 border-emerald-500/50' : 'hover:bg-emerald-500/20'}`}>
                {supporter && (
                    <img 
                        src={`https://www.google.com/s2/favicons?sz=64&domain=${supporter.domain}`}
                        className="w-full h-full object-contain p-1 opacity-80"
                    />
                )}
            </div>
        ));

        const App = () => {
            const gridData = useMemo(() => {
                const data = new Array(2500).fill(null);
                for(let i=0; i<40; i++) {
                    const rand = Math.floor(Math.random() * 2500);
                    data[rand] = MOCK_SUPPORTERS[Math.floor(Math.random() * MOCK_SUPPORTERS.length)];
                }
                return data;
            }, []);

            return (
                <div className="min-h-screen relative">
                    <header className="relative z-20 py-16 text-center">
                        <h1 className="text-6xl font-black tracking-tighter text-white drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]">THE GREEN GRID</h1>
                        <p className="text-emerald-400 tracking-[0.3em] uppercase text-xs mt-4 opacity-80">Global Ecosystem Restoration</p>
                    </header>
                    
                    <main className="max-w-[900px] mx-auto px-4 pb-40 relative">
                        <div className="relative aspect-square">
                            {/* Η 3D ΓΗ ΜΕΣΑ ΣΤΟ GRID CONTAINER */}
                            <Earth3D />
                            
                            {/* ΤΟ GRID */}
                            <div className="grid grid-cols-50 gap-0 grid-mesh relative z-10 w-full h-full">
                                {gridData.map((s, i) => <GridCell key={i} supporter={s} />)}
                            </div>
                        </div>
                    </main>

                    <footer className="fixed bottom-0 w-full bg-black/80 backdrop-blur-2xl border-t border-white/10 p-6 z-30">
                        <div className="max-w-4xl mx-auto flex items-center gap-6">
                            <div className="flex flex-col">
                                <span className="text-emerald-500 font-bold uppercase text-[10px] tracking-widest">Planet Recovery</span>
                                <span className="text-white font-mono text-xl">34.02%</span>
                            </div>
                            <div className="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden">
                                <div className="h-full bg-emerald-500 shadow-[0_0_15px_#10b981]" style={{width: '34%'}}></div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
